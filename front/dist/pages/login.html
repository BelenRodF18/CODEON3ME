<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Power - Iniciar Sesión</title>
    <meta name="description" content="Iniciá sesión en FitPower con tu usuario y tu contraseña para entrar a tu panel.">
    <link rel="icon" type="image/png" href="../assets/logos/logo.png">

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="../css/librerias/bootstrap.min.css?v=5.3.3" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"></noscript>

    <link rel="stylesheet" href="../css/style.css?v=20261120">
</head>
<body class="body-auth">

    <!-- ===== Contenido principal ===== -->
    <main class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="contenedor-auth">
            <div class="caja-auth p-4">
                <a href="../../index.html" class="btn-volver text-decoration-none d-block mb-4">← Volver al inicio</a>
                <div class="mt-3">
                </div>

                <div class="auth-logo mb-3">
                    <a href="../../index.html" title="Ir al inicio"><img src="../assets/logos/logo.png" alt="Fit Power" class="img-fluid" style="max-height: 100px;" loading="lazy" decoding="async"></a>
                </div>

                <h2 class="text-white mb-4">Acceso al Sistema</h2>

                <!-- ===== Formulario de inicio de sesión ===== -->
                <form id="form-login" class="formulario-auth text-start">
                    <div class="grupo-input mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" id="username" name="usuario" class="form-control" placeholder="ej. juan.diaz" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                    </div>

                    <div class="grupo-input mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div id="mensaje-login" class="text-danger small mb-3" style="display:none;"></div>

                    <div class="contenedor-botones-auth">
                        <button type="submit" class="btn-degradado-auth w-100">Iniciar Sesión</button>
                    </div>
                </form>

                <div class="auth-cambio mt-4">
                    <a href="masinformacion.html" class="d-inline-block text-white text-decoration-underline" style="font-size: 13px;">¿No tienes cuenta? Solicita tu acceso presencialmente con el Administrador.</a>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== Scripts ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="../js/api.js?v=20261110"></script>
    <script src="../js/login.js?v=20261110"></script>
    <script src="../js/i18n.js?v=20261118"></script>
    <script src="../js/i18n-paneles.js?v=20261115"></script>
</body>
</html>
