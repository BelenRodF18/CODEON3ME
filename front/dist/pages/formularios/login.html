<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Power - Iniciar Sesión</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../css/login.css">
</head>
<body class="body-auth">

    <main class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="contenedor-auth">
            <div class="caja-auth p-4">
                <a href="../../../index.html" class="btn-volver text-decoration-none d-block mb-4">← Volver al inicio</a>
                <div class="mt-3">
                    </div>

                <div class="auth-logo mb-3">
                    <img src="../../assets/logos/logo.png" alt="Fit Power" class="img-fluid" style="max-height: 100px;">
                </div>

                <h2 class="text-white mb-4">Acceso al Sistema</h2>

                <form id="form-login" class="formulario-auth text-start">
                    <div class="grupo-input mb-3">
                        <label for="username" class="form-label">Email</label>
                        <input type="email" id="username" name="email" class="form-control" placeholder="usuario@fitpower.com" required>
                    </div>

                    <div class="grupo-input mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div id="mensaje-login" class="text-danger small mb-3" style="display:none;"></div>

                    <div class="contenedor-botones-auth">
                        <button type="submit" class="btn-degradado-auth w-100">Iniciar Sesión</button>
                    </div>
                </form>

                <div class="auth-cambio mt-4">
                    <a href="../hero/masinformacion.html" class="d-inline-block text-white text-decoration-underline" style="font-size: 13px;">¿No tienes cuenta? Solicita tu acceso presencialmente con el Administrador.</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script>
        document.getElementById('form-login').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const mensaje = document.getElementById('mensaje-login');

            mensaje.style.display = 'none';
            mensaje.textContent = '';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok || data.status !== 'success') {
                    mensaje.textContent = data.message || 'Credenciales inválidas';
                    mensaje.style.display = 'block';
                    return;
                }

                const rol = data.usuario.rol;

                if (rol === 'admin') {
                    window.location.href = '../dashboard/admin/dashboard-admin.html';
                } else if (rol === 'entrenador') {
                    window.location.href = '../dashboard/entrenador/dashboard-entrenador.html';
                } else if (rol === 'socio') {
                    window.location.href = '../dashboard/socio/dashboard-socio.html';
                } else if (rol === 'personal') {
                    window.location.href = '../dashboard/personal/dashboard-personal.html';
                } else {
                    mensaje.textContent = 'Rol no reconocido';
                    mensaje.style.display = 'block';
                }
            } catch (error) {
                mensaje.textContent = 'No se pudo conectar con la API';
                mensaje.style.display = 'block';
            }
        });
    </script>
</body>
</html>
