<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Power - Iniciar Sesión</title>
    <link rel="icon" type="image/png" href="../../assets/logos/logo.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../css/login.css?v=20260918">
</head>
<body class="body-auth">

    <main class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="contenedor-auth">
            <div class="caja-auth p-4">
                <a href="../../../index.html" class="btn-volver text-decoration-none d-block mb-4">← Volver al inicio</a>
                <div class="mt-3">
                    </div>

                <div class="auth-logo mb-3">
                    <img src="../../assets/logos/logo.png" alt="Fit Power" class="img-fluid" style="max-height: 100px;">
                </div>

                <h2 class="text-white mb-4">Acceso al Sistema</h2>

                <form id="form-login" class="formulario-auth text-start">
                    <div class="grupo-input mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" id="username" name="usuario" class="form-control" placeholder="ej. juan.diaz" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                    </div>

                    <div class="grupo-input mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div id="mensaje-login" class="text-danger small mb-3" style="display:none;"></div>

                    <div class="contenedor-botones-auth">
                        <button type="submit" class="btn-degradado-auth w-100">Iniciar Sesión</button>
                    </div>
                </form>

                <div class="auth-cambio mt-4">
                    <a href="../hero/masinformacion.html" class="d-inline-block text-white text-decoration-underline" style="font-size: 13px;">¿No tienes cuenta? Solicita tu acceso presencialmente con el Administrador.</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script>
        // Panel de cada rol, relativo a esta página.
        const PANELES = {
            admin: '../dashboard/admin/dashboard-admin.html',
            entrenador: '../dashboard/entrenador/dashboard-entrenador.html',
            socio: '../dashboard/socio/dashboard-socio.html',
            recepcion: '../dashboard/recepcion/dashboard-recepcion.html',
            personal: '../dashboard/personal/dashboard-personal.html'
        };

        // Por qué se volvió al login desde un panel.
        const MOTIVOS = {
            expirada: 'Tu sesión venció por inactividad. Iniciá sesión de nuevo.',
            otra_cuenta: 'En este navegador se inició sesión con otra cuenta. Iniciá sesión de nuevo para seguir.'
        };

        const mensaje = document.getElementById('mensaje-login');

        /** Muestra un aviso debajo del formulario (error en rojo, info en verde). */
        const mostrarMensaje = (texto, tipo = 'error') => {
            mensaje.textContent = texto;
            mensaje.className = (tipo === 'error' ? 'text-danger' : 'text-success') + ' small mb-3';
            mensaje.style.display = texto ? 'block' : 'none';
        };

        // Si ya hay una sesión abierta, no hace falta volver a loguearse: se va a su panel.
        (async () => {
            const motivo = new URLSearchParams(location.search).get('motivo');
            if (MOTIVOS[motivo]) mostrarMensaje(MOTIVOS[motivo], 'info');

            try {
                const response = await fetch('/api/sesion');
                if (!response.ok) return;
                const data = await response.json();
                if (!data.usuario) return;
                const panel = PANELES[data.usuario.rol];
                if (!panel) return;

                if (motivo === 'otra_cuenta') {
                    mensaje.innerHTML = '';
                    mostrarMensaje(MOTIVOS.otra_cuenta + ' Ahora la sesión abierta es de ' + data.usuario.nombre + '.', 'info');
                    const enlace = document.createElement('a');
                    enlace.href = panel;
                    enlace.textContent = ' Ir a su panel';
                    enlace.className = 'text-white';
                    mensaje.appendChild(enlace);
                    return;
                }
                window.location.replace(panel);
            } catch (error) { /* sin API: se muestra el formulario igual */ }
        })();

        document.getElementById('form-login').addEventListener('submit', async function(e) {
            e.preventDefault();

            const usuario = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            mostrarMensaje('');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await response.json();

                if (!response.ok || data.status !== 'success') {
                    mostrarMensaje(data.message || 'Credenciales inválidas');
                    return;
                }

                const panel = PANELES[data.usuario.rol];
                if (panel) {
                    window.location.href = panel;
                } else {
                    mostrarMensaje('Rol no reconocido');
                }
            } catch (error) {
                mostrarMensaje('No se pudo conectar con la API');
            }
        });
    </script>
</body>
</html>
