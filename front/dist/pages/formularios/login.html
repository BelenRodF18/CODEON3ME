<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Power - Iniciar Sesión</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../css/login.css">
</head>
<body class="body-auth">

    <main class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="contenedor-auth">
            <div class="caja-auth p-4">
                <a href="../../index.html" class="btn-volver text-decoration-none d-block mb-4">← Volver al inicio</a>

                <div class="auth-logo mb-3">
                    <img src="../../assets/logos/logo.png" alt="Fit Power" class="img-fluid" style="max-height: 100px;">
                </div>

                <h2 class="text-white mb-4">Acceso al Sistema</h2>

                <form id="form-login" class="formulario-auth text-start">
                    <div class="grupo-input mb-3">
                        <label for="username" class="form-label">Nombre de Usuario</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="Ingrese su usuario" required>
                    </div>

                    <div class="grupo-input mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="grupo-input mb-4">
                        <label for="user-role" class="form-label">Tipo de Cuenta / Rol</label>
                        <select id="user-role" class="form-select">
                            <option value="socio">Socio / Cliente</option>
                            <option value="entrenador">Entrenador Staff</option>
                            <option value="admin">Administrador General</option>
                        </select>
                    </div>

                    <div class="contenedor-botones-auth">
                        <button type="submit" class="btn-degradado-auth w-100">Iniciar Sesión</button>
                    </div>
                </form>

                <div class="auth-cambio mt-4">
                    <p class="m-0 text-muted" style="font-size: 13px;">¿No tienes cuenta? Solicita tu acceso presencialmente con el Administrador.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script>
        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault();
            const rol = document.getElementById('user-role').value;
            if (rol === 'socio') {
                window.location.href = "../../pages/dashboard/socio/socio.html";
            } else if (rol === 'entrenador') {
                window.location.href = "../../pages/dashboard/entrenador/entrenador.html";
            } else if (rol === 'admin') {
                window.location.href = "../../pages/dashboard/admin/admin.html";
            }
        });
    </script>
</body>
</html>
