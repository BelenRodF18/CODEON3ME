<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard Personal - FitPower</title><link rel="stylesheet" href="../../../css/socio.css"></head>
<body class="socio-app"><div class="socio-shell"><aside class="socio-sidebar"><div class="socio-brand"><img src="../../../assets/logos/logo.png" alt="Fit Power"><small>Personal de mantenimiento</small></div><nav class="socio-nav"><button class="active" data-view="mantenimiento"><span>01</span> Mantenimiento</button></nav><button class="socio-logout" id="logout">Cerrar sesión</button></aside><main class="socio-main"><header class="socio-topbar"><div><div class="socio-kicker">Operación del gimnasio</div><h1>Panel de mantenimiento</h1></div><div class="socio-avatar">PM</div></header><section class="socio-view active" id="view-mantenimiento"><div class="socio-section"><h2>Reportes de máquinas</h2><p class="socio-meta">Solo se muestran reportes de mantenimiento. Las sugerencias son privadas del administrador.</p></div><button id="refresh" class="socio-button" style="margin:20px 0">Actualizar reportes</button><div id="reports" class="report-list">Cargando...</div></section></main></div><script>
const reports=document.getElementById('reports');const api=async(path,options={})=>{const response=await fetch('/api'+path,options);const data=await response.json();if(!response.ok)throw Error(data.message||'No se pudo completar la operación');return data};const escapeHtml=(value)=>String(value).replace(/[&<>'"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));const loadMessages=async(id,box)=>{const data=await api(`/personal/conversaciones/${id}/mensajes`);box.innerHTML=data.mensajes.map((message)=>`<div class="chat-message"><strong>${escapeHtml(message.nombre)}:</strong> ${escapeHtml(message.mensaje)}</div>`).join('')||'<small>No hay mensajes.</small>'};const load=async()=>{const data=await api('/personal/conversaciones');reports.innerHTML=data.conversaciones.map((item)=>`<article class="socio-card full"><div class="socio-status"><div><h3>${escapeHtml(item.etiqueta)}</h3><p>${escapeHtml(item.descripcion)}</p></div><span class="tag ${item.estado==='solucionado'?'ok':''}">${escapeHtml(item.estado.replace('_',' '))}</span></div><small class="socio-meta">${escapeHtml(item.socio)} · ${escapeHtml(item.creado)}</small><div class="d-flex gap-2 mt-3"><select class="form-select state" data-id="${item.id}"><option value="abierto" ${item.estado==='abierto'?'selected':''}>Abierto</option><option value="en_revision" ${item.estado==='en_revision'?'selected':''}>En revisión</option><option value="en_reparacion" ${item.estado==='en_reparacion'?'selected':''}>En reparación</option><option value="solucionado" ${item.estado==='solucionado'?'selected':''}>Solucionado</option></select><button class="socio-button save" data-id="${item.id}">Guardar estado</button></div><div class="chat-box"><strong>Chat con el socio</strong><div class="messages chat-messages mt-2">Cargando...</div><form class="reply d-flex gap-2 mt-2" data-id="${item.id}"><input class="form-control" required placeholder="Responder al socio"><button class="socio-button secondary">Enviar</button></form></div></article>`).join('')||'<div class="empty">No hay reportes de mantenimiento.</div>';for(const item of data.conversaciones){const form=document.querySelector(`.reply[data-id="${item.id}"]`);await loadMessages(item.id,form.closest('.socio-card').querySelector('.messages'))}document.querySelectorAll('.save').forEach((button)=>button.onclick=async()=>{const state=document.querySelector(`.state[data-id="${button.dataset.id}"]`).value;await api(`/personal/conversaciones/${button.dataset.id}/estado`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado:state})});load()});document.querySelectorAll('.reply').forEach((form)=>form.onsubmit=async(event)=>{event.preventDefault();const input=form.querySelector('input');await api(`/personal/conversaciones/${form.dataset.id}/mensajes`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mensaje:input.value})});input.value='';load()})};document.getElementById('refresh').onclick=()=>load().catch((error)=>reports.textContent=error.message);document.getElementById('logout').onclick=async(event)=>{event.preventDefault();await api('/logout',{method:'POST'});location.replace('../../../../index.html')};(async()=>{const me=await api('/me');if(me.usuario?.rol!=='personal')return location.replace('../../formularios/login.html');load()})().catch(()=>location.replace('../../formularios/login.html'));
</script></body></html>
