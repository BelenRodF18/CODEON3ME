<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Fit Power</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/socio.css">
</head>
<body class="socio-app">
    <div class="socio-shell">
        <aside class="socio-sidebar"><div class="socio-brand"><img src="../../../assets/logos/logo.png" alt="Fit Power"><small>Panel administrativo</small></div><nav class="socio-nav" aria-label="Secciones administrativas"><button class="active" data-view="usuarios"><span>01</span> Usuarios</button><button data-view="socios"><span>02</span> Socios</button><button data-view="conversaciones"><span>03</span> Conversaciones</button></nav><button class="socio-logout" id="cerrar-sesion">Cerrar sesión</button></aside>
        <main class="socio-main">
            <header class="socio-topbar"><div><div class="socio-kicker">Gestión interna</div><h1>Panel de administración</h1></div><div class="socio-avatar">AD</div></header>
            <section class="socio-view active" id="view-usuarios"><div class="socio-card full"><h2>Usuarios del sistema</h2><form id="usuario-form" class="form-grid"><div class="field"><label>Nombre completo<input name="nombre" required></label></div><div class="field"><label>Email<input name="email" type="email" required></label></div><div class="field"><label>Contraseña<input name="password" type="password" minlength="6" required></label></div><div class="field"><label>Rol<select name="rol_id"><option value="3">Socio</option><option value="2">Entrenador</option><option value="4">Personal</option><option value="1">Administrador</option></select></label></div><button class="socio-button full" type="submit">Crear usuario</button></form><div id="usuarios-admin" class="routine-list" style="margin-top:22px">Cargando...</div></div></section>
            <section class="socio-view" id="view-socios"><div class="socio-card full"><h2>Socios y membresías</h2><div id="socios-admin" class="routine-list">Cargando...</div><hr><h3>Catálogo de ejercicios</h3><form id="ejercicio-form" class="form-grid"><div class="field"><label>Nombre<input name="nombre" required></label></div><div class="field"><label>Grupo muscular<input name="grupo_muscular" required></label></div><div class="field full"><label>Descripción<input name="descripcion"></label></div><button class="socio-button" type="submit">Agregar ejercicio</button></form><div id="ejercicios-admin" class="routine-list" style="margin-top:18px"></div></div></section>
            <section class="socio-view" id="view-conversaciones"><div class="socio-card full"><div class="socio-status"><div><h2>Bandeja de conversaciones</h2><p>Sugerencias y reportes enviados por los socios.</p></div><button id="actualizar-conversaciones" class="socio-button">Actualizar</button></div><div id="conversaciones-admin" class="report-list" style="margin-top:20px">Cargando...</div></div></section>
        </main>
    </div>
    <script>
        const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' }[character]));
        const api = async (path, options = {}) => { const response = await fetch('/api' + path, options); const data = await response.json(); if (!response.ok) throw new Error(data.message || 'No se pudo completar la operación'); return data; };
        const show = (name) => { document.querySelectorAll('.socio-view').forEach((view) => view.classList.toggle('active', view.id === 'view-' + name)); document.querySelectorAll('.socio-nav button').forEach((button) => button.classList.toggle('active', button.dataset.view === name)); };
        document.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => show(button.dataset.view)));
        const cargarUsuarios = (usuarios) => { document.getElementById('usuarios-admin').innerHTML = usuarios.map((user) => `<div class="routine-item"><div class="routine-head"><strong>${escapeHtml(user.nombre)}</strong><small>${escapeHtml(user.rol)} · ${user.activo == 1 ? 'Activo' : 'Inactivo'}</small></div><p class="socio-meta">${escapeHtml(user.email)}</p><div class="d-flex gap-2 mt-2"><button class="socio-button secondary edit-user" data-id="${user.id}" data-name="${escapeHtml(user.nombre)}" data-email="${escapeHtml(user.email)}">Editar</button><button class="socio-button danger disable-user" data-id="${user.id}" ${user.activo == 0 ? 'disabled' : ''}>Dar de baja</button></div></div>`).join('') || '<div class="empty">No hay usuarios registrados.</div>'; document.querySelectorAll('.edit-user').forEach((button) => button.addEventListener('click', async () => { const nombre = prompt('Nombre', button.dataset.name); const email = prompt('Email', button.dataset.email); if (!nombre || !email) return; await api(`/admin/usuarios/${button.dataset.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre, email }) }); cargarDatos(); })); document.querySelectorAll('.disable-user').forEach((button) => button.addEventListener('click', async () => { if (!confirm('¿Dar de baja este usuario?')) return; await api(`/admin/usuarios/${button.dataset.id}`, { method: 'DELETE' }); cargarDatos(); })); };
        const cargarDatos = async () => { const data = await api('/admin/resumen'); cargarUsuarios(data.usuarios); const plans = data.planes.map((plan) => `<option value="${plan.id}">${escapeHtml(plan.nombre)}</option>`).join(''); document.getElementById('socios-admin').innerHTML = data.socios.map((socio) => `<div class="routine-item"><div class="routine-head"><strong>${escapeHtml(socio.nombre)}</strong><small>${escapeHtml(socio.email)}</small></div><p class="socio-meta">Membresía: ${escapeHtml(socio.membresia)}</p><div class="form-grid"><div class="field"><label>Entrenador<select class="admin-trainer" data-id="${socio.id}"><option value="0">Sin entrenador</option>${data.entrenadores.map((trainer) => `<option value="${trainer.id}" ${String(trainer.id) === String(socio.entrenador_id) ? 'selected' : ''}>${escapeHtml(trainer.nombre)}</option>`).join('')}</select></label></div><div class="field"><label>Plan<select class="admin-plan" data-id="${socio.id}">${plans}</select></label></div><div class="field"><label>Vencimiento<input class="admin-date" data-id="${socio.id}" type="date" value="${socio.vencimiento || ''}"></label></div><div class="field"><label>Estado<select class="admin-status" data-id="${socio.id}"><option ${socio.membresia === 'Al dia' ? 'selected' : ''}>Al dia</option><option ${socio.membresia === 'Vencida' ? 'selected' : ''}>Vencida</option><option ${socio.membresia === 'Bloqueada' ? 'selected' : ''}>Bloqueada</option></select></label></div></div><button class="socio-button admin-save" data-id="${socio.id}">Guardar cambios</button></div>`).join('') || '<div class="empty">No hay socios registrados.</div>'; document.querySelectorAll('.admin-plan').forEach((select) => { const socio = data.socios.find((item) => String(item.id) === select.dataset.id); if (socio?.plan_id) select.value = socio.plan_id; }); document.getElementById('ejercicios-admin').innerHTML = data.ejercicios.map((exercise) => `<div class="exercise-row"><span>${escapeHtml(exercise.nombre)}</span><span>${escapeHtml(exercise.grupo_muscular)}</span></div>`).join(''); document.querySelectorAll('.admin-save').forEach((button) => button.addEventListener('click', async () => { const id = button.dataset.id; await api(`/admin/socios/${id}/entrenador`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ entrenador_id: document.querySelector(`.admin-trainer[data-id="${id}"]`).value }) }); await api(`/admin/socios/${id}/membresia`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ plan_id: document.querySelector(`.admin-plan[data-id="${id}"]`).value, vencimiento: document.querySelector(`.admin-date[data-id="${id}"]`).value, estado: document.querySelector(`.admin-status[data-id="${id}"]`).value }) }); cargarDatos(); })); };
        const cargarConversaciones = async () => { const data = await api('/admin/conversaciones'); document.getElementById('conversaciones-admin').innerHTML = data.conversaciones.map((conversation) => `<article class="report-item"><header><strong>${conversation.tipo === 'sugerencia' ? 'Sugerencia' : 'Mantenimiento'} · ${escapeHtml(conversation.etiqueta)}</strong><span class="tag">${escapeHtml(conversation.estado)}</span></header><p>${escapeHtml(conversation.descripcion)}</p><small class="socio-meta">${escapeHtml(conversation.socio)} · ${conversation.creado}</small><div id="admin-chat-${conversation.id}" class="chat-messages">Cargando...</div><form class="admin-reply d-flex gap-2 mt-2" data-id="${conversation.id}"><input class="form-control" required placeholder="Responder"><button class="socio-button">Enviar</button></form><div class="d-flex gap-2 mt-2"><button class="socio-button secondary admin-state" data-id="${conversation.id}" data-state="en_reparacion">En reparación</button><button class="socio-button" data-id="${conversation.id}" data-state="solucionado">Solucionado</button></div></article>`).join('') || '<div class="empty">No hay conversaciones.</div>'; data.conversaciones.forEach(async (conversation) => { const messages = await api(`/admin/conversaciones/${conversation.id}/mensajes`); document.getElementById(`admin-chat-${conversation.id}`).innerHTML = messages.mensajes.map((message) => `<div class="chat-message"><strong>${escapeHtml(message.nombre)}:</strong> ${escapeHtml(message.mensaje)}</div>`).join(''); }); document.querySelectorAll('.admin-reply').forEach((form) => form.addEventListener('submit', async (event) => { event.preventDefault(); const input = form.querySelector('input'); await api(`/admin/conversaciones/${form.dataset.id}/mensajes`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mensaje: input.value }) }); input.value = ''; cargarConversaciones(); })); document.querySelectorAll('[data-state]').forEach((button) => button.addEventListener('click', async () => { await api(`/admin/conversaciones/${button.dataset.id}/estado`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estado: button.dataset.state }) }); cargarConversaciones(); })); };
        document.getElementById('usuario-form').addEventListener('submit', async (event) => { event.preventDefault(); const result = await api('/admin/usuarios', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(event.currentTarget))) }); alert(result.message); event.currentTarget.reset(); cargarDatos(); });
        document.getElementById('ejercicio-form').addEventListener('submit', async (event) => { event.preventDefault(); await api('/admin/ejercicios', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(event.currentTarget))) }); event.currentTarget.reset(); cargarDatos(); });
        document.getElementById('actualizar-conversaciones').addEventListener('click', cargarConversaciones);
        document.getElementById('cerrar-sesion').addEventListener('click', async (event) => { event.preventDefault(); await api('/logout', { method: 'POST' }); location.replace('../../../../index.html'); });
        (async () => { const me = await api('/me'); if (me.usuario?.rol !== 'admin') return location.replace('../../formularios/login.html'); cargarDatos(); cargarConversaciones(); })().catch(() => location.replace('../../formularios/login.html'));
    </script>
</body>
</html>
