<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Entrenador - Fit Power</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/estilos.css">
    <link rel="stylesheet" href="../../../css/mobile.css">
</head>
<body class="bg-black text-white">
    <header>
        <nav class="navbar">
            <div class="logo"><img src="../../../assets/logos/logo.png" alt="Fit Power"></div>
            <div class="iconos-nav">
                <a href="../../../../index.html" class="btn-negro-link">Cerrar sesión</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="contenedor-programas">
            <div class="caja-borde-programas">
                <h1 class="titulo-programas">Panel del entrenador</h1>
                <div class="row g-4 w-100 mt-3">
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="p-4 rounded-4 h-100" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(170,250,100,0.2);">
                            <h3 style="color: #AAFA64;">Rutinas</h3>
                            <p>Planifica y actualiza rutinas para tus alumnos.</p>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="p-4 rounded-4 h-100" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(100,250,181,0.2);">
                            <h3 style="color: #64FAB5;">Asistencias</h3>
                            <p>Controla la participación y asistencia semanal.</p>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="p-4 rounded-4 h-100" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(100,245,250,0.2);">
                            <h3 style="color: #64F5FA;">Mensajes</h3>
                            <p>Recibe solicitudes y comentarios del alumnado.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
